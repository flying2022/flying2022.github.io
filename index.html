<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 联系财多多 | 终端控制台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* 科技感等宽字体 */
            font-family: 'Consolas', 'Courier New', monospace; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #030712; /* 深空暗色背景 */
            /* 科技感扫描网格 */
            background-image: 
                radial-gradient(circle at 50% 0%, #0d2745 0%, transparent 60%),
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: #e2f1ff;
            overflow: hidden;
        }

        /* 终端风格控制面板 */
        .tech-card {
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-top: 3px solid #00f0ff; /* 顶部高亮科技蓝带 */
            border-radius: 6px;
            padding: 50px 40px;
            text-align: left; /* 终端默认左对齐 */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 240, 255, 0.05);
            max-width: 550px;
            width: 90%;
            position: relative;
        }

        /* 四角的高亮准星修饰 */
        .tech-card::before, .tech-card::after {
            content: ''; position: absolute; width: 15px; height: 15px; border: 2px solid transparent;
        }
        .tech-card::before {
            top: -2px; left: -2px; border-top-color: #00f0ff; border-left-color: #00f0ff;
        }
        .tech-card::after {
            bottom: -2px; right: -2px; border-bottom-color: #00f0ff; border-right-color: #00f0ff;
        }

        h1 { 
            font-size: 2.2em; 
            margin-bottom: 20px; 
            color: #ffffff; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        /* 标题前的跳动光标 */
        h1::before {
            content: '>';
            color: #00f0ff;
            margin-right: 12px;
            animation: blink 1s step-end infinite;
        }

        .subtitle { 
            font-size: 1.05em; 
            color: #00f0ff; 
            margin-bottom: 40px; 
            min-height: 4.5em; /* 给多行打字预留空间 */
            line-height: 1.6;
        }
        
        .cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background-color: #00f0ff;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* 按钮组 */
        .links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: flex-start; }
        
        .btn {
            text-decoration: none; 
            padding: 10px 20px; 
            font-weight: bold; 
            letter-spacing: 1px; 
            transition: all 0.3s ease; 
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.5);
        }
        
        /* TG 按钮 - 数据流蓝 */
        .btn-tg { 
            color: #00f0ff; 
            border: 1px solid #00f0ff; 
        }
        .btn-tg:hover { 
            background: rgba(0, 240, 255, 0.15); 
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); 
            text-shadow: 0 0 5px #00f0ff;
        }

        /* 邮箱 按钮 - 终端绿 */
        .btn-email { 
            color: #00ff9d; 
            border: 1px solid #00ff9d; 
        }
        .btn-email:hover { 
            background: rgba(0, 255, 157, 0.15); 
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.4); 
            text-shadow: 0 0 5px #00ff9d;
        }
    </style>
</head>
<body>

    <div class="tech-card">
        <h1>Flying2022</h1>
        <!-- 终端启动日志容器 -->
        <div class="subtitle">
            <span id="typewriter"></span><span class="cursor"></span>
        </div>
        
        <div class="links">
            <!-- 【注意】在这里修改你的 TG 和 邮箱地址！ -->
            <a href="https://t.me/mrpay666" class="btn btn-tg" target="_blank">[ TARGET: Telegram ]</a >
            <a href="" class="btn btn-email">[ TARGET: Email ]</a >
        </div>
    </div>

    <script>
        // 模拟终端初始化代码流
        const text = "Sys.init() ... OK<br>Modules: Python / Frontend / AI ... Loaded<br>Status: System Online & Ready_";
        let i = 0;
        const speed = 50; 
        
        function typeWriter() {
            if (i < text.length) {
                // 处理换行符标签
                let current = text.substring(i, i + 4);
                if (current === "<br>") {
                    document.getElementById("typewriter").innerHTML += "<br>";
                    i += 4;
                } else {
                    document.getElementById("typewriter").innerHTML += text.charAt(i);
                    i++;
                }
                // 模拟终端偶尔卡顿的真实感
                let randomDelay = Math.random() > 0.9 ? speed + 200 : speed;
                setTimeout(typeWriter, randomDelay);
            }
        }
        
        // 延迟 0.5 秒启动特效
        setTimeout(typeWriter, 500);
    </script>
</body>
</html>
